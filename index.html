<meta charset=utf-8><meta name=viewport content="width=device-width"><title>Показ экрана</title>
<style>body{font:16px system-ui;max-width:640px;margin:20px auto;padding:0 12px;background:#fff;color:#111}@media(prefers-color-scheme:dark){body{background:#14171c;color:#eee}}textarea,video{width:100%}textarea{height:90px}button{padding:8px 14px;margin:4px 4px 4px 0}</style>
<h2>Показ экрана (только просмотр)</h2><b id=s>Ожидание</b>
<h3>Показываю я</h3>
<button id=a>1. Поделиться экраном</button><textarea id=o readonly placeholder="Код: отправьте зрителю"></textarea>
<textarea id=r placeholder="Ответный код от зрителя"></textarea><button id=b>3. Разрешить просмотр</button>
<h3>Смотрю я</h3>
<textarea id=i placeholder="Код от показывающего"></textarea><button id=c>2. Создать ответный код</button>
<textarea id=u readonly placeholder="Ответный код: отправьте обратно"></textarea><video id=v autoplay playsinline controls muted></video>
<script>
let p,$=i=>document.getElementById(i),S=t=>$("s").textContent=t,
E=d=>btoa(unescape(encodeURIComponent(JSON.stringify(d)))),
D=t=>JSON.parse(decodeURIComponent(escape(atob(t.trim())))),
N=()=>(p=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]}),p.onconnectionstatechange=()=>S(p.connectionState),p),
W=()=>new Promise(r=>{p.onicegatheringstatechange=()=>p.iceGatheringState=="complete"&&r();setTimeout(r,4e3)});
$("a").onclick=async()=>{try{let m=await navigator.mediaDevices.getDisplayMedia({video:1});N();m.getTracks().forEach(t=>p.addTrack(t,m));await p.setLocalDescription(await p.createOffer());await W();$("o").value=E(p.localDescription);S("Отправьте код зрителю")}catch(e){S(e.message)}};
$("b").onclick=()=>p.setRemoteDescription(D($("r").value)).catch(e=>S("Неверный код"));
$("c").onclick=async()=>{try{N();p.ontrack=e=>$("v").srcObject=e.streams[0];await p.setRemoteDescription(D($("i").value));await p.setLocalDescription(await p.createAnswer());await W();$("u").value=E(p.localDescription);S("Отправьте ответный код")}catch(e){S("Неверный код")}};
</script>
