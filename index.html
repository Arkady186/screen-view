<meta charset=utf-8><meta name=viewport content="width=device-width"><title>Показ экрана</title>
<style>body{font:18px system-ui;max-width:640px;margin:20px auto;padding:0 12px;background:#fff;color:#111}@media(prefers-color-scheme:dark){body{background:#14171c;color:#eee}}video{width:100%;margin-top:12px}button,input{font:inherit;padding:8px 14px;margin:4px 4px 4px 0}#k{font-size:32px;letter-spacing:4px}</style>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<h2>Показ экрана</h2><b id=s>Выберите действие</b><p>
<button id=a>Показать мой экран</button> <b id=k></b><p>
<input id=i maxlength=5 size=6 placeholder="Код"><button id=c>Смотреть</button>
<video id=v autoplay playsinline controls muted></video>
<script>
let $=i=>document.getElementById(i),S=t=>$("s").textContent=t,P="arkady-sv-";
$("a").onclick=async()=>{try{
let m=await navigator.mediaDevices.getDisplayMedia({video:1}),ok=0,
k=[...crypto.getRandomValues(new Uint8Array(5))].map(x=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[x%32]).join(""),
p=new Peer(P+k);
p.on("open",()=>{$("k").textContent=k;S("Отправьте этот код зрителю")});
p.on("error",e=>S("Ошибка: "+e.type));
p.on("call",c=>{if(ok||!confirm("Разрешить просмотр вашего экрана?"))return c.close();ok=1;c.answer(m);S("Идёт показ");c.on("close",()=>{ok=0;S("Зритель отключился")})});
m.getVideoTracks()[0].onended=()=>{p.destroy();$("k").textContent="";S("Показ остановлен")}
}catch(e){S(e.message)}};
$("c").onclick=()=>{let p=new Peer(),d=document.createElement("canvas");d.getContext("2d").fillRect(0,0,1,1);
p.on("error",e=>S("Ошибка: "+e.type));
p.on("open",()=>{let c=p.call(P+$("i").value.trim().toUpperCase(),d.captureStream(1));S("Ждём разрешения…");c.on("stream",s=>{$("v").srcObject=s;S("Подключено")});c.on("close",()=>S("Отключено"))})};
</script>
